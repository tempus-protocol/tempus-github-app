[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tempus-github-app"
version = "0.2.0"
description = "Tempus Guard for GitHub: the mediated executor and the Verified by Tempus check, on the Tempus protocol"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Tempus DDB Contributors"}
]
keywords = [
    "ai",
    "agents",
    "authorization",
    "audit",
    "cryptography",
    "github",
    "github-app",
    "tempus-ddb",
    "zero-trust"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    # The Guard flow needs the 0.6 core (export_bundle with verify_url, verify_bundle
    # trust report, bundle_digest). Until 0.6.0 is on PyPI, install the core from git:
    #   pip install "tempus-ddb @ git+https://github.com/Julio-Patron/tempus-ddb.git@main"
    "tempus-ddb>=0.6,<0.7",
    "cryptography>=42.0.0",
    "pyjwt>=2.8.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]
dev = [
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "uvicorn>=0.29.0",
]

[project.scripts]
tempus-github-app-executor = "tempus_github_app.cli:main"
tempus-github-app-server = "tempus_github_app.server:main"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
target-version = "py310"
line-length = 100
