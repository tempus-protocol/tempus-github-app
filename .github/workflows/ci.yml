name: CI

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # The core is built from git (Rust). Cold compiles on macOS exceed 20 minutes.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']
        # The Guard flow needs the 0.6 core. Until 0.6.0 is published on PyPI the only
        # source is the core's main branch; add the published floor ('0.6.0') back here
        # once the release is out.
        tempus-ddb: ['main']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Rust for the pinned Tempus runtime
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install dependencies
        shell: bash
        env:
          TEMPUS_DDB: ${{ matrix.tempus-ddb }}
        run: |
          python -m pip install --upgrade pip
          # The core first, from git, so the editable install below resolves the
          # tempus-ddb>=0.6 requirement against it instead of looking on PyPI.
          if [ "$TEMPUS_DDB" = "main" ]; then
            python -m pip install \
              "tempus-ddb @ git+https://github.com/Julio-Patron/tempus-ddb.git@main"
          else
            python -m pip install "tempus-ddb==$TEMPUS_DDB"
          fi
          python -m pip install -e ".[dev,server]"

      - name: Run Ruff check
        run: ruff check .

      - name: Run tests with pytest
        run: pytest tests/ -v --tb=short

      - name: Test CLI entrypoints
        run: |
          tempus-github-app-executor --help
          tempus-github-app-executor --version
          tempus-github-app-server --help
